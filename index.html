<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>단축이</title>
<style>
:root{--glass:rgba(255,255,255,.55);--line:rgba(255,255,255,.72);--text:#172033;--muted:#667085;--accent:#6d5dfc}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--text)}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:
radial-gradient(circle at 15% 20%,rgba(113,196,255,.65),transparent 34%),
radial-gradient(circle at 85% 25%,rgba(178,142,255,.55),transparent 36%),
linear-gradient(135deg,#eaf7ff,#f5efff 55%,#eef8ff)}
.card{width:min(760px,100%);padding:clamp(22px,5vw,46px);border:1px solid var(--line);border-radius:28px;background:var(--glass);
box-shadow:0 24px 70px rgba(54,63,102,.16);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
h1{margin:0;font-size:clamp(32px,6vw,52px);letter-spacing:-.05em} .sub{margin:8px 0 28px;color:var(--muted)}
.workspace{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:stretch}
.panel{min-height:280px;border:1px solid rgba(255,255,255,.75);border-radius:22px;background:rgba(255,255,255,.38);padding:20px}
.drop{height:100%;min-height:238px;display:grid;place-items:center;text-align:center;border:1.5px dashed rgba(82,92,135,.28);border-radius:18px;cursor:pointer;padding:24px}
.drop strong{display:block;font-size:18px;margin-bottom:7px}.drop span{color:var(--muted);font-size:14px}
input{display:none}.previewWrap{height:100%;display:grid;place-items:center;text-align:center}.preview{width:150px;height:150px;border-radius:32px;background:rgba(255,255,255,.7);box-shadow:0 14px 32px rgba(43,52,90,.18);object-fit:cover;display:none}
.empty{color:var(--muted);font-size:14px}.actions{display:flex;gap:12px;margin-top:20px}.btn{appearance:none;border:0;border-radius:15px;padding:14px 18px;font-weight:750;font-size:15px;cursor:pointer;flex:1}
.primary{background:linear-gradient(135deg,#5f73ff,#8a5cf6);color:#fff;box-shadow:0 10px 24px rgba(103,91,246,.25)}
.secondary{background:rgba(255,255,255,.65);color:var(--text);border:1px solid rgba(255,255,255,.9)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.note{margin:14px 2px 0;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:620px){body{padding:14px}.card{border-radius:22px;padding:22px}.workspace{grid-template-columns:1fr}.panel{min-height:220px}.drop{min-height:180px}.preview{width:132px;height:132px}.actions{flex-direction:column}}
.devices{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}.devices button{flex:1;border:1px solid #aeb5d0;background:#fff;padding:12px;border-radius:12px;font-size:16px;min-width:90px}.devices button[aria-pressed="true"]{background:#5f59d9;color:white;border-color:#5f59d9}button,label.drop,summary{cursor:pointer}details{margin-top:20px;font-size:16px;line-height:1.7}summary{font-weight:600}#status{font-size:14px;line-height:1.6}.note{font-size:14px}.panel{min-width:0}
</style>
</head>
<body>
<main class="card">
  <h1>단축이</h1>
  <p class="sub">기기를 고르고 사진을 선택하세요.</p>
  <nav class="devices" aria-label="사용할 기기">
<button type="button" data-device="computer" aria-pressed="true">컴퓨터용</button>
<button type="button" data-device="tablet" aria-pressed="false">태블릿용</button>
<button type="button" data-device="phone" aria-pressed="false">휴대폰용</button>
</nav>
<section class="workspace">
    <div class="panel">
      <label class="drop" for="file">
        <div><strong>사진 선택</strong><span>사진을 누르거나 끌어다 놓으세요</span></div>
      </label>
      <input id="file" type="file" accept="image/*" />
    </div>
    <div class="panel">
      <div class="previewWrap">
        <img id="preview" class="preview" alt="아이콘 미리보기" />
        <div id="empty" class="empty">아이콘 미리보기</div>
      </div>
    </div>
  </section>
  <div class="actions">
    <button id="choose" class="btn secondary">사진 업로드</button>
    <button id="download" class="btn primary" disabled>아이콘 받기</button>
  </div>
  <p class="note">여러 크기의 아이콘과 웹 적용 파일을 ZIP으로 받습니다.</p>
<p id="status" role="status" aria-live="polite"></p>
<details><summary>적용 방법</summary><div id="guide"></div></details>
</main>
<canvas id="canvas" width="512" height="512" hidden></canvas>
<script>
const file=document.getElementById('file'), choose=document.getElementById('choose'), download=document.getElementById('download');
const preview=document.getElementById('preview'), empty=document.getElementById('empty'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const status=document.getElementById('status'),guide=document.getElementById('guide');
let device='computer',photo=null,loadId=0;
function updateGuide(){guide.textContent='받은 ZIP을 풀고 아이콘 파일과 manifest.webmanifest를 웹의 시작 페이지와 같은 폴더에 넣으세요. 웹에 넣을 설정.txt의 내용을 시작 페이지의 <head> 안에 추가하고 다시 배포하세요. '+(device==='computer'?'크롬에서 사이트를 다시 열고 설치 메뉴가 제공되면 설치하세요. 기존 바로가기에 옛 그림이 남으면 삭제 후 다시 만드세요.':'안드로이드에서는 크롬의 홈 화면 추가를, 아이폰·아이패드에서는 사파리의 공유 → 홈 화면에 추가를 사용하세요. 기존 회색 바로가기는 삭제 후 다시 추가하세요.')+' 아이콘 받기만으로 기존 웹이나 홈 화면이 자동 변경되지는 않습니다.';}
document.querySelectorAll('[data-device]').forEach(button=>button.onclick=()=>{device=button.dataset.device;document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));updateGuide();});updateGuide();
choose.onclick=()=>{file.value='';file.click();};
document.querySelector('.drop').addEventListener('dragover',e=>e.preventDefault());
document.querySelector('.drop').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])load(e.dataTransfer.files[0]);});
file.onchange=()=>file.files[0]&&load(file.files[0]);
function load(f){const id=++loadId;if(!f.type.startsWith('image/')){status.textContent='사진 파일을 선택해주세요.';return;}download.disabled=true;status.textContent='사진을 불러오는 중입니다.';const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);if(id!==loadId)return;photo=img;const size=Math.min(img.width,img.height);ctx.clearRect(0,0,512,512);ctx.drawImage(img,(img.width-size)/2,(img.height-size)/2,size,size,0,0,512,512);preview.src=canvas.toDataURL('image/png');preview.style.display='block';empty.style.display='none';download.disabled=false;choose.textContent='사진 바꾸기';status.textContent='사진 중앙을 정사각형으로 잘랐습니다. 미리보기를 확인하세요.';};img.onerror=()=>{URL.revokeObjectURL(url);if(id!==loadId)return;download.disabled=!photo;status.textContent='이 사진을 읽을 수 없습니다. JPG 또는 PNG 사진으로 다시 선택해주세요.';};img.src=url;}
function crc32(data){let crc=0xffffffff;for(const byte of data){crc^=byte;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}return(crc^0xffffffff)>>>0;}
function makeZip(files){const enc=new TextEncoder(),parts=[],directory=[];let offset=0;for(const[name,data]of files){const n=enc.encode(name),crc=crc32(data),head=new Uint8Array(30+n.length),v=new DataView(head.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(12,33,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,n.length,true);head.set(n,30);parts.push(head,data);const c=new Uint8Array(46+n.length),d=new DataView(c.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint16(14,33,true);d.setUint32(16,crc,true);d.setUint32(20,data.length,true);d.setUint32(24,data.length,true);d.setUint16(28,n.length,true);d.setUint32(42,offset,true);c.set(n,46);directory.push(c);offset+=head.length+data.length;}const end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,directory.reduce((s,x)=>s+x.length,0),true);e.setUint32(16,offset,true);return new Blob([...parts,...directory,end],{type:'application/zip'});}
function png(size,mask=false){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');if(mask){x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(canvas,size*.2,size*.2,size*.6,size*.6);}else x.drawImage(canvas,0,0,size,size);return new Promise((resolve,reject)=>c.toBlob(async b=>{if(b)resolve(new Uint8Array(await b.arrayBuffer()));else reject(new Error('PNG 생성 실패'));},'image/png'));}
download.onclick=async()=>{if(!photo)return;download.disabled=true;try{const files=[];for(const size of[16,32,180,192,512])files.push(['icon-'+size+'.png',await png(size)]);files.push(['icon-maskable-512.png',await png(512,true)]);const enc=new TextEncoder();const manifest={name:'단축이',short_name:'단축이',start_url:'./',scope:'./',display:'standalone',icons:[{src:'icon-192.png',sizes:'192x192',type:'image/png',purpose:'any'},{src:'icon-512.png',sizes:'512x512',type:'image/png',purpose:'any'},{src:'icon-maskable-512.png',sizes:'512x512',type:'image/png',purpose:'maskable'}]};files.push(['manifest.webmanifest',enc.encode(JSON.stringify(manifest,null,2))]);files.push(['웹에 넣을 설정.txt',enc.encode('<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">\n<link rel="icon" type="image/png" sizes="16x16" href="./icon-16.png">\n<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">\n<link rel="manifest" href="./manifest.webmanifest">')]);files.push(['적용 안내.txt',enc.encode(guide.textContent+'\n다른 웹에 쓰려면 manifest의 이름을 그 웹 이름으로 바꾸세요. 기존 manifest가 있는 웹은 새 파일로 덮지 말고 icons 설정을 병합하세요. 기존 icon 링크도 중복되지 않도록 교체하세요. 이 파일들은 사이트 시작 페이지와 같은 폴더 기준이며, 다른 구조에서는 경로를 맞춰야 합니다. 설치 가능 여부는 브라우저와 웹 구성에 따라 다릅니다.')]);const url=URL.createObjectURL(makeZip(files)),a=document.createElement('a');a.href=url;a.download='danchugi-icons-'+device+'.zip';a.click();setTimeout(()=>URL.revokeObjectURL(url),60000);status.textContent='아이콘 묶음을 만들었습니다. 적용 방법을 펼쳐 다음 단계를 확인하세요.';}catch(e){status.textContent='아이콘 생성에 실패했습니다. 사진을 다시 선택해주세요.';}finally{download.disabled=false;}};

</script>
</body>
</html>
