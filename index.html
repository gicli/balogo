.panel{padding:22px;min-height:clamp(300px,27.5vw,424px);border-radius:26px;background:#edf0ff45;border:2px solid #ffffffcf}

.btn:hover:not(:disabled){background:#ffffff15!important;filter:none}

.card:not([data-current="computer"]) .devices button{background:linear-gradient(135deg,#e9e8fcef,#e2e0f5ef)!important;color:#674dce;border:2px solid #ffffffaa}
.card:not([data-current="computer"]) .devices svg{opacity:1}
.card:not([data-current="computer"]) .devices button[aria-pressed="true"]{background:linear-gradient(135deg,#a28aff,#7c55f5)!important;color:white;box-shadow:inset 0 0 0 3px #ffffff40!important}
}

<body>
<main class="card" data-current="computer">
<img class="reference-surface" src="./assets/reference-surface.webp" alt="" aria-hidden="true" />
  <h1><img class="title-image" src="./assets/danchugi-title.webp" alt="단축이" /></h1>
  <p class="sub">기기를 고르고 사진을 선택하세요.</p>
  <nav class="devices" aria-label="사용할 기기">
<button type="button" data-device="computer" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>컴퓨터용</button>
<button type="button" data-device="tablet" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M11 19h2"/></svg>태블릿용</button>
<button type="button" data-device="phone" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 19h2"/></svg>휴대폰용</button>
</nav>
<section class="workspace">
    <div class="panel">
      <label class="drop" for="file">
        <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></svg><strong>사진 선택</strong><span>사진을 누르거나 끌어다 놓으세요</span></div>
      </label>
      <input id="file" type="file" accept="image/*" />
    </div>
    <div class="panel">
      <div class="previewWrap">
        <img id="preview" class="preview" style="display:none" alt="아이콘 미리보기" />
        <div id="empty" class="empty" style="display:none">아이콘 미리보기</div>
      </div>
    </div>
  </section>
  <div class="actions">
    <button id="paste" class="btn secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="5" rx="2"/></svg><span>사진 붙여넣기</span></button>
    <button id="choose" class="btn secondary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="8" r="1.5"/><path d="m4 17 5-5 4 4 3-3 5 5"/></svg><span>사진 바꾸기</span></button>
    <button id="download" class="btn primary" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><span>아이콘 받기</span></button>
  </div>
</main>
<section class="support" aria-label="사용 안내">
<p id="status" role="status" aria-live="polite"></p>
<details><summary>적용 방법</summary>
  <p class="note">복사한 사진은 ‘사진 붙여넣기’ 또는 Ctrl+V로 넣으세요.</p>
  <p class="note">여러 크기의 아이콘과 웹 적용 파일을 ZIP으로 받습니다.</p>
<div id="guide"></div></details>
</section>

<canvas id="canvas" width="512" height="512" hidden></canvas>
<script>
const file=document.getElementById('file'), choose=document.getElementById('choose'), download=document.getElementById('download');
const preview=document.getElementById('preview'), empty=document.getElementById('empty'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
const status=document.getElementById('status'),guide=document.getElementById('guide');
let device='computer',photo=null,loadId=0,downloadUrl=null;
function updateGuide(){
const finish=device==='computer'?'컴퓨터 크롬에서 웹 열기 → 메뉴(⋮) → 설치 또는 바로가기 만들기':device==='tablet'?'안드로이드 태블릿: 크롬 메뉴(⋮) → 홈 화면에 추가. 아이패드: 사파리 공유 → 홈 화면에 추가':'안드로이드 휴대폰: 크롬 메뉴(⋮) → 홈 화면에 추가. 아이폰: 사파리 공유 → 홈 화면에 추가';
guide.innerHTML=`<p><strong>사진을 받는 것만으로 회색 아이콘이 바뀌지는 않아요.</strong><br>먼저 내 웹에 그림을 넣고, 바로가기를 다시 만드세요.</p>
<div class="flow"><div>① 사진 선택 또는 붙여넣기</div><span>↓</span><div>② 미리보기 확인 → 아이콘 받기</div><span>↓</span><div>③ 받은 ZIP 파일의 압축 풀기</div><span>↓</span><div>④ GitHub에서 index.html이 있는 곳에<br>아이콘 그림과 manifest.webmanifest 올리기</div><span>↓</span><div>⑤ 아래 ‘설정 넣는 법’대로 설정 추가 → 배포 완료 기다리기</div><span>↓</span><div>⑥ ${finish}</div></div>
<details><summary>설정 넣는 법 (한 번만)</summary><ol><li>압축을 푼 ‘웹에 넣을 설정.txt’를 열고 내용을 전부 복사하세요.</li><li>GitHub에서 내 웹의 index.html을 열고 연필 버튼(수정)을 누르세요.</li><li>&lt;/head&gt;를 찾아 그 바로 위에 복사한 내용을 붙여넣으세요.</li><li>Commit changes(변경 저장)를 누르세요. Vercel에 연결되어 있다면 새 배포가 끝날 때까지 기다리세요.</li></ol><p>이미 icon 또는 manifest 설정이 있으면 중복 추가 대신 기존 설정을 수정해야 합니다. 그 경우 웹 파일을 보내주시면 제가 수정해드릴 수 있어요.</p></details>
<p>예전 회색 바로가기는 삭제하고 새로 추가하세요. 설치 메뉴의 이름은 기기마다 조금 다를 수 있어요. 이 안내는 직접 수정할 수 있는 내 웹에 적용됩니다.</p>`;}
document.querySelectorAll('[data-device]').forEach(button=>button.onclick=()=>{device=button.dataset.device;document.querySelector('.card').dataset.current=device;document.querySelectorAll('[data-device]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));updateGuide();});updateGuide();
choose.onclick=()=>{file.value='';file.click();};
document.querySelector('.drop').addEventListener('dragover',e=>e.preventDefault());
document.querySelector('.drop').addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files[0])load(e.dataTransfer.files[0]);});
file.onchange=()=>file.files[0]&&load(file.files[0]);
document.addEventListener('paste',e=>{const items=Array.from(e.clipboardData?.items||[]);const item=items.find(i=>i.type.startsWith('image/'));if(item){const blob=item.getAsFile();if(blob){e.preventDefault();load(blob);}}else{status.textContent='복사된 사진이 없습니다. 사진 자체를 복사하거나 사진 선택을 이용하세요.';}});
document.getElementById('paste').onclick=async()=>{try{if(!navigator.clipboard?.read){status.textContent='이 브라우저에서는 붙여넣기 버튼을 사용할 수 없습니다. 컴퓨터에서는 Ctrl+V, 휴대폰·태블릿에서는 사진 선택을 이용하세요.';return;}const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type){load(await item.getType(type));return;}}status.textContent='복사된 사진이 없습니다. 먼저 사진을 복사하세요.';}catch(e){status.textContent='사진을 가져오지 못했습니다. 붙여넣기 권한을 허용하거나 Ctrl+V 또는 사진 선택을 이용하세요.';}};
function load(f){const id=++loadId;if(!f.type.startsWith('image/')){status.textContent='사진 파일을 선택해주세요.';return;}download.disabled=true;status.textContent='사진을 불러오는 중입니다.';const url=URL.createObjectURL(f),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);if(id!==loadId)return;photo=img;const size=Math.min(img.width,img.height);ctx.clearRect(0,0,512,512);ctx.drawImage(img,(img.width-size)/2,(img.height-size)/2,size,size,0,0,512,512);preview.src=canvas.toDataURL('image/png');preview.style.display='block';empty.style.display='none';download.disabled=false;choose.querySelector('span').textContent='사진 바꾸기';status.textContent='사진 중앙을 정사각형으로 잘랐습니다. 미리보기를 확인하세요.';};img.onerror=()=>{URL.revokeObjectURL(url);if(id!==loadId)return;download.disabled=!photo;status.textContent='이 사진을 읽을 수 없습니다. JPG 또는 PNG 사진으로 다시 선택해주세요.';};img.src=url;}
function crc32(data){let crc=0xffffffff;for(const byte of data){crc^=byte;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}return(crc^0xffffffff)>>>0;}
function makeZip(files){const enc=new TextEncoder(),parts=[],directory=[];let offset=0;for(const[name,data]of files){const n=enc.encode(name),crc=crc32(data),head=new Uint8Array(30+n.length),v=new DataView(head.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(12,33,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,n.length,true);head.set(n,30);parts.push(head,data);const c=new Uint8Array(46+n.length),d=new DataView(c.buffer);d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x800,true);d.setUint16(14,33,true);d.setUint32(16,crc,true);d.setUint32(20,data.length,true);d.setUint32(24,data.length,true);d.setUint16(28,n.length,true);d.setUint32(42,offset,true);c.set(n,46);directory.push(c);offset+=head.length+data.length;}const end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,directory.reduce((s,x)=>s+x.length,0),true);e.setUint32(16,offset,true);return new Blob([...parts,...directory,end],{type:'application/zip'});}
function png(size,mask=false){const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');if(mask){x.fillStyle='#fff';x.fillRect(0,0,size,size);x.drawImage(canvas,size*.2,size*.2,size*.6,size*.6);}else x.drawImage(canvas,0,0,size,size);return new Promise((resolve,reject)=>c.toBlob(async b=>{if(b)resolve(new Uint8Array(await b.arrayBuffer()));else reject(new Error('PNG 생성 실패'));},'image/png'));}
download.onclick=async()=>{if(!photo)return;download.disabled=true;try{const files=[];for(const size of[16,32,180,192,512])files.push(['icon-'+size+'.png',await png(size)]);files.push(['icon-maskable-512.png',await png(512,true)]);const enc=new TextEncoder();const manifest={name:'단축이',short_name:'단축이',start_url:'./',scope:'./',display:'standalone',icons:[{src:'icon-192.png',sizes:'192x192',type:'image/png',purpose:'any'},{src:'icon-512.png',sizes:'512x512',type:'image/png',purpose:'any'},{src:'icon-maskable-512.png',sizes:'512x512',type:'image/png',purpose:'maskable'}]};files.push(['manifest.webmanifest',enc.encode(JSON.stringify(manifest,null,2))]);files.push(['웹에 넣을 설정.txt',enc.encode('<link rel="icon" type="image/png" sizes="32x32" href="./icon-32.png">\n<link rel="icon" type="image/png" sizes="16x16" href="./icon-16.png">\n<link rel="apple-touch-icon" sizes="180x180" href="./icon-180.png">\n<link rel="manifest" href="./manifest.webmanifest">')]);files.push(['적용 안내.txt',enc.encode(guide.textContent+'\n다른 웹에 쓰려면 manifest의 이름을 그 웹 이름으로 바꾸세요. 기존 manifest가 있는 웹은 새 파일로 덮지 말고 icons 설정을 병합하세요. 기존 icon 링크도 중복되지 않도록 교체하세요. 이 파일들은 사이트 시작 페이지와 같은 폴더 기준이며, 다른 구조에서는 경로를 맞춰야 합니다. 설치 가능 여부는 브라우저와 웹 구성에 따라 다릅니다.')]);if(downloadUrl)URL.revokeObjectURL(downloadUrl);const url=URL.createObjectURL(makeZip(files)),a=document.createElement('a');a.href=url;a.download='danchugi-icons-'+device+'.zip';a.hidden=true;document.body.appendChild(a);a.click();a.remove();downloadUrl=url;status.textContent='아이콘 묶음을 만들었습니다. ';a.hidden=false;a.id='icon-save';a.className='download-link';a.textContent='아이콘 ZIP 저장';status.appendChild(a);}catch(e){status.textContent='아이콘 생성에 실패했습니다. 사진을 다시 선택해주세요.';}finally{download.disabled=false;}};

const example=new Image();example.onload=()=>{if(loadId!==0)return;ctx.drawImage(example,864,384,400,400,0,0,512,512);preview.src=canvas.toDataURL('image/png');if(window.matchMedia('(max-width:620px)').matches)preview.style.display='block';empty.style.display='none';photo=example;download.disabled=false;};example.src='./assets/reference-surface.webp';
